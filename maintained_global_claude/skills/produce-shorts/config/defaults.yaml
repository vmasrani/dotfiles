# Pipeline defaults for produce-shorts. Override per episode by copying the
# relevant block into episode.yaml (episode values win over these defaults).

transcription:
  engine: assemblyai          # assemblyai | mlx-whisper — explicit; scripts fail loud
                              # if the engine's requirements (API key / isolated
                              # tracks for diarization) are missing.
  language: en

sync:
  min_confidence: 0.90        # below this, sync_cameras.py exits nonzero

subtitles:
  font: "Inter Semibold"
  font_fallbacks: ["Arial Bold", "Helvetica Bold"]
  base_color: "#FFFFFF"
  max_lines: 2
  # 42 was too permissive for 1080x1920: the renderer auto-fits type to the longest line,
  # so a 42-character card shrinks the whole clip's subtitles to ~42px — small on a phone.
  # Shorter lines let the fit land larger (measured 42px -> 64px on the same clip).
  max_chars_per_line: 32
  max_chars_per_second: 20
  min_display_seconds: 0.8
  emphasis_max_word_fraction: 0.15
  # Outline weight as a fraction of font size. Was hard-coded at 0.05, which put a 3px edge on
  # a 57px font — measurably too light: white captions over a speaker's cream shirt rendered
  # effectively white-on-white. 0.10 is the thinnest weight that stayed legible over the worst
  # case in this series (a blown-out white observatory dome behind white text).
  outline_fraction: 0.10
  outline_color: "#101010"
  shadow_fraction: 0.04
  # "outline" = stroked glyphs (the default, keeps the picture visible).
  # "plate"   = a semi-opaque box behind the text; use only where footage is so busy or bright
  #             that no stroke survives. It is heavier and hides more of the frame.
  border_style: outline
  plate_opacity: 0.55

safe_zones:                   # 1080x1920 reference frame, pixels
  top: 200
  bottom: 320
  right: 120
  left: 60

platform_profiles:              # each carries `format:` (short|clip); copied into episode.yaml at ingest
  - name: youtube-shorts
    format: short
    aspect: "9:16"
    resolution: "1080x1920"
    fps: 30
    max_duration_s: 180
    container: mp4
    video_codec: h264
    audio_codec: aac
    loudness_lufs: -14.0
    true_peak_dbtp: -1.0
  - name: tiktok
    format: short
    aspect: "9:16"
    resolution: "1080x1920"
    fps: 30
    max_duration_s: 180
    container: mp4
    video_codec: h264
    audio_codec: aac
    loudness_lufs: -14.0
    true_peak_dbtp: -1.0

  - name: youtube
    format: clip
    aspect: "16:9"
    resolution: "1920x1080"
    fps: 30
    max_duration_s: null      # horizontal clips have no maximum
    container: mp4
    video_codec: h264
    audio_codec: aac
    loudness_lufs: -14.0
    true_peak_dbtp: -1.0

review:                       # Google Docs review surfaces
  account: incrementspodcast@gmail.com
  drive_folder: "Shorts review"   # top-level Drive folder; one subfolder per episode
  grey: "#9E9E9E"             # text outside every pick
  boundary_pad_s: 0.12        # freeze pads pick edges, never into a neighbouring word
  max_paragraph_s: 45         # long turns split into timestamped paragraphs
  palette:                    # one per pick, never reused in a doc
    ["#FFE08A", "#B6E3F4", "#C8F0C0", "#F9C6D0", "#D9C8F5", "#FFD1A6",
     "#B8F2E6", "#F5E6A3", "#C9D7F8", "#F2C1E8", "#D4EDB0", "#FFC9C9"]

framing:                      # plan_framing.py (shorts)
  exchange_gap_s: 2.0         # question→answer within this = both parties live
  exchange_turn_s: 6.0        # back-and-forth of turns shorter than this = split screen
  max_dwell_s: 12.0           # no single treatment held longer
  # extract_segments.py: a closeup frames head-and-shoulders (face box ~30% of the frame height, eye line ~0.33).
  # The source crop is never magnified past this factor; when the speaker's tile cannot fill 9:16 at that scale the
  # sharp crop is laid over a blurred, darkened copy of itself instead of being zoomed until it turns to mush.
  max_upscale: 2.0

render:
  internal_cut_crossfade_ms: 8   # audio micro-crossfade at internal cuts
  qc_loudness_tolerance_lu: 1.0
