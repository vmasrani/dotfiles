# Seeded by project-workflow init for Rust projects. Per-job parallelism is NOT
# set here on purpose: NEXTEST_TEST_THREADS from the shell env caps it as
# cpus / QUEUE_SLOTS so concurrent queued suites don't oversubscribe the box.
[profile.default]
fail-fast = false                                        # sweep-then-assert: never stop at the first failure
slow-timeout = { period = "60s", terminate-after = 5 }   # a hung test can't hold a queue slot forever

[profile.ci]
fail-fast = false
retries = 2                                              # absorb flakes on shared runners without a full requeue
slow-timeout = { period = "120s", terminate-after = 3 }
