name: Deep CI

# Vendored, placeholder-free. Toolchain setup keys off what is actually in the
# tree, so one template serves every project and nothing needs rendering.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Deep integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: agent-deep-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Same Rust-path setup as ci-fast.yml, and for the same measured reasons:
      # reclaim disk (a debug build fills the runner's ~15 GB free and SIGBUSes
      # the linker), install nextest (not bundled with the toolchain), cache
      # ~/.cargo + target/, and drop full debug info. This job runs the WHOLE
      # suite on the dev->main promotion, so it needs all of it. See ci-fast.yml
      # for the per-step rationale.
      - name: Reclaim runner disk
        if: hashFiles('**/Cargo.toml') != ''
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('**/Cargo.toml') != ''
      - uses: taiki-e/install-action@nextest
        if: hashFiles('**/Cargo.toml') != ''
      # `cache-on-failure` is load-bearing: without it a run cancelled by
      # `timeout-minutes` never saves its cache, so the next run starts cold and
      # is cancelled too -- a closed loop no ceiling short of absurd would break
      # (parot-core Deep CI lived in it from Jul 24-29, seven cancelled runs).
      # With it, a killed run banks every crate it compiled and successive runs
      # finish the build incrementally -- across ALL cargo profiles ci-deep
      # touches, which a one-shot warm job running only ci-fast cannot do
      # (measured: parot-core run 30225847048 seeded ci-fast's debug profile in
      # 21m, and integration still timed out cold-building the gauntlet's
      # `quick` profile).
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('**/Cargo.toml') != ''
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('**/pyproject.toml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('**/package.json') != ''
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      # setup-node above installs a node RUNTIME, not dependencies. The JS
      # checks inside ci-fast -- which ci-deep runs too -- need an installed
      # tree and deliberately refuse to create one; they fail loud instead.
      # This job is where that was MEASURED (run 30227033020, `typecheck-apps`,
      # no node_modules on the runner). Installing is setup, so it lives here
      # rather than inside a gate. Keyed on a lockfile, not package.json:
      # `npm ci` requires one and errors without it. Must follow
      # install-action@just.
      - name: Install JS dependencies
        if: hashFiles('**/package-lock.json') != ''
        run: just install-js
      - name: Run deep project checks
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: just ci-deep
      - name: Disk after checks
        if: always()
        run: df -h /
